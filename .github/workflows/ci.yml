name: Brick Builder CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: brick-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run ui:localization:check
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx vitest run tests/engine.test.ts tests/math.test.ts tests/renderer.test.ts tests/persistence.test.ts
      - run: npm run benchmark

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run assets:build:all
      - run: npm run assets:validate
      - run: npm run assets:determinism
      - run: npm run assets:release -- --dry-run --version v1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brick_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brick_builder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/brick_builder
      SESSION_SECRET: brick-builder-ci-session-secret-please-replace-in-production
      APP_ORIGIN: http://127.0.0.1:5173
      THUMBNAIL_STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run db:migrate
      - run: npm run migrations:validate
      - run: npm run test:integration
      - run: npm run api > api.log 2>&1 & API_PID=$!; trap 'kill $API_PID' EXIT; curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8787/health

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: [quality, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run bundle:check

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brick_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brick_builder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/brick_builder
      SESSION_SECRET: brick-builder-ci-session-secret-please-replace-in-production
      APP_ORIGIN: http://127.0.0.1:5173
      THUMBNAIL_STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert "fixed browser renderer performance scenarios"

  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    needs: [web]
    env:
      BROWSER_BENCHMARK_SMOKE: "true"
      BROWSER_BENCHMARK_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:browser

  nightly:
    name: Nightly Full Release Gates
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [e2e]
    env:
      BROWSER_BENCHMARK_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run ci:validate
      - run: npm run benchmark:browser
      - run: npm run assets:release -- --dry-run --version v1
